# Default variables for docker role
---
# Container deployment configuration
containers: []
docker_services: {}

# Master enable switch for docker role logic
docker_enabled: true

# System configuration - inherit from common role if available
timezone: "{{ timezone | default('UTC') }}"

# Path configuration
docker_volumes_path: "/var/docker_volumes"
docker_config_path: "/srv/docker"
python_system_venvs_path: "/srv/python_venvs"

