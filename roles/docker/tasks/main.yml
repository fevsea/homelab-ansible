---
# Docker role main tasks - simplified and consolidated

- name: Validate docker configuration
  ansible.builtin.assert:
    that:
      - docker_volumes_path is defined
      - docker_config_path is defined
    fail_msg: "Docker configuration variables are missing or incomplete"
    quiet: true
  tags:
    - docker
    - validation

- name: Install Docker (if enabled)
  include_tasks: install.yml
  when: docker_enabled | default(true)
  tags:
    - docker-install

# Consolidated container deployment - single include per service
- name: Deploy Docker services
  include_tasks: deploy_service.yml
  loop: "{{ containers | select('in', docker_services) | list }}"
  loop_control:
    loop_var: compose_name
  vars:
    compose_data: "{{ docker_services[compose_name] }}"
  when:
    - containers is defined
    - containers | length > 0
    - docker_services is defined
    - docker_services | length > 0
  tags:
    - docker-deploy
