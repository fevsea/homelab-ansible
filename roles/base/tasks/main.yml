---
- name: Base | Ensure baseline packages installed
  package:
    name: "{{ base_packages }}"
    state: present
  when: base_packages | length > 0

- name: Base | Manage users (if any defined)
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ base_users }}"
  when: base_users | length > 0

- name: Base | MOTD template (optional)
  template:
    src: motd.j2
    dest: /etc/motd
    mode: '0644'
  when: base_manage_motd | bool
  notify: base_restart_dummy  # Example handler placeholder
