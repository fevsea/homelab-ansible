---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: base-role-test
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    privileged: false
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
  inventory:
    host_vars: {}
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - lint
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
