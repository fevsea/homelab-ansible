# Main site playbook for homelab infrastructure
---
- name: Configure base system
  hosts: all
  become: true
  roles:
    - role: common
  tags:
    - base
    - common

- name: Configure Docker hosts
  hosts: all
  become: true
  roles:
    - role: docker
  when: containers is defined and containers | length > 0
  tags:
    - docker
    - containers
