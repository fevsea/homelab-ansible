# Backup playbook for homelab infrastructure
---
- name: Perform system and Docker backups
  hosts: all
  become: true
  roles:
    - role: backup
  tags:
    - backup

- name: Docker-specific backup tasks
  hosts: all
  become: true
  tasks:
    - name: Include Docker backup tasks
      include_role:
        name: backup
        tasks_from: docker_volumes
      when: 
        - containers is defined
        - containers | length > 0
  tags:
    - backup
    - docker
