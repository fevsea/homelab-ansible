# Host variables for tooling server
---
# Network Configuration
ip: 192.168.5.10
gateway: 192.168.5.1
interface: eth0

# Container Configuration
containers:
  - mongodb
  - nexus
  - mlflow
  - uptimekuma

# Docker Services Configuration
docker_services:
  mongodb:
    - name: "mongodb"
      image: "mongo"
      tag: "8-noble"
      ports:
        - "27017:27017"
      volumes:
        mongodb_volume: "/data/db"
      env:
        MONGO_INITDB_ROOT_USERNAME: "{{ mongodb_user }}"
        MONGO_INITDB_ROOT_PASSWORD: "{{ mongodb_password }}"
        TZ: "{{ timezone }}"
      healthcheck:
        test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
        interval: "30s"
        timeout: "10s"
        retries: 3

  uptimekuma:
    - name: "uptimekuma"
      image: "louislam/uptime-kuma"
      tag: "1.23.15-alpine"
      ports:
        - "4030:3001"
      volumes:
        uptimekuma_data: "/app/data"
      env:
        TZ: "{{ timezone }}"

  nexus:
    - name: "nexus"
      image: "sonatype/nexus3"
      tag: "3.77.1-alpine"
      ports:
        - "8081:8081"
        - "8085:8085"
      volumes:
        nexus_data: "/nexus-data"
      env:
        TZ: "{{ timezone }}"
        NEXUS_SECURITY_RANDOMPASSWORD: "false"

  mlflow:
    - name: "mlflow"
      image: "bitnami/mlflow"
      tag: "2.20.1"
      ports:
        - "8082:5000"
      volumes:
        mlflow_data: "/bitnami/mlflow"
      env:
        TZ: "{{ timezone }}"
        MLFLOW_DATABASE_URI: "mongodb://{{ mongodb_user }}:{{ mongodb_password }}@mongodb:27017/mlflow"
      depends_on:
        - mongodb

# Application-specific variables
mongodb_user: "mongo"
mongodb_password: "{{ db_password }}"

# Backup configuration
backup_enabled: true
docker_backup_enabled: true

# Additional users for this host
additional_user:
  - username: hypercube
    uid: 1027
