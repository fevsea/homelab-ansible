[defaults]
# Output and logging
stdout_callback = debug
host_key_checking = False
log_path = ansible.log

# Inventory and connection settings
inventory = inventory.yml
remote_user = ansible
private_key_file = ~/.ssh/homelab_ansible

# Behavior settings
timeout = 30
forks = 10
gathering = smart
fact_caching = memory
retry_files_enabled = False

# Role and collection paths
roles_path = roles
collections_path = collections

# Vault settings
vault_password_file = ~/.ssh/vault

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False